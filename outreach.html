<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Outreach Hub — Отправка презентаций в Telegram</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #0F1012;
            --bg-card: #18191C;
            --bg-card-hover: #202226;
            --bg-input: #121316;
            --border: #2D3036;
            --border-focus: #C87A5B;
            --text-main: #F3F1EC;
            --text-muted: #9BA0A8;
            --accent: #C87A5B;
            --accent-hover: #D8896A;
            --tg-blue: #2AABEE;
            --tg-blue-hover: #229ED9;
            --green: #2ECC71;
            --radius-card: 14px;
            --radius-btn: 8px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px 80px;
            line-height: 1.5;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        /* HEADER */
        .hub-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .hub-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(200, 122, 91, 0.12);
            border: 1px solid rgba(200, 122, 91, 0.3);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
        }
        .hub-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 500;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        .hub-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 620px;
            margin: 0 auto 24px;
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }
        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .stat-val {
            font-weight: 700;
            color: var(--accent);
        }

        /* GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
            gap: 28px;
        }
        @media (max-width: 680px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        /* CARD */
        .salon-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: var(--transition);
            position: relative;
        }
        .salon-card:hover {
            border-color: rgba(200, 122, 91, 0.4);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }
        .brand-meta-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .monogram-badge {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #25282E;
            color: var(--accent);
            border: 1px solid rgba(200, 122, 91, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .brand-titles h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-weight: 500;
            color: #FFFFFF;
            margin-bottom: 2px;
        }
        .brand-titles .address {
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        .status-select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: var(--transition);
        }
        .status-select.sent {
            background: rgba(46, 204, 113, 0.15);
            border-color: rgba(46, 204, 113, 0.4);
            color: #2ECC71;
        }
        .status-select.waiting {
            background: rgba(241, 196, 15, 0.15);
            border-color: rgba(241, 196, 15, 0.4);
            color: #F1C40F;
        }

        /* SCREENS PREVIEW */
        .screens-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            height: 150px;
        }
        .screen-thumb-wrap {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #000;
            cursor: pointer;
        }
        .screen-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 0.3s ease;
        }
        .screen-thumb-wrap:hover img {
            transform: scale(1.04);
        }
        .screen-label {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(4px);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #FFF;
            letter-spacing: 0.04em;
        }
        .copy-img-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(24, 25, 28, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
        }
        .screen-thumb-wrap:hover .copy-img-btn {
            opacity: 1;
        }
        .copy-img-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* TEXT EDITABLE */
        .text-wrap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .text-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        textarea.message-input {
            width: 100%;
            height: 150px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.86rem;
            line-height: 1.45;
            resize: vertical;
            outline: none;
            transition: var(--transition);
        }
        textarea.message-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px rgba(200, 122, 91, 0.2);
        }

        /* ACTIONS */
        .actions-row {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 480px) {
            .actions-row {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: var(--radius-btn);
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
        }
        .btn-tg {
            background: var(--tg-blue);
            color: #FFFFFF;
        }
        .btn-tg:hover {
            background: var(--tg-blue-hover);
            transform: translateY(-1px);
        }
        .btn-copy {
            background: #25282E;
            color: var(--text-main);
            border-color: var(--border);
        }
        .btn-copy:hover {
            background: #2E323A;
            border-color: #4A4E57;
        }
        .btn-site {
            background: transparent;
            color: var(--accent);
            border-color: rgba(200, 122, 91, 0.4);
        }
        .btn-site:hover {
            background: rgba(200, 122, 91, 0.12);
            border-color: var(--accent);
        }

        /* TOAST NOTIFICATION */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ECC71;
            color: #0F1012;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* LIGHTBOX FOR SCREENSHOTS */
        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lightbox-modal.active {
            display: flex;
        }
        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.8);
            border: 1px solid var(--border);
        }
    </style>
</head>

        function renderHub() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = SALONS_DATA.map(s => {
                const savedStatus = localStorage.getItem(`status_${s.id}`) || 'new';
                return `
                    <div class="salon-card" id="card_${s.id}">
                        <div class="card-top">
                            <div class="brand-meta-box">
                                <div class="monogram-badge">${s.monogram}</div>
                                <div class="brand-titles">
                                    <h3>${s.name}</h3>
                                    <div class="address">${s.address} • <span style="color:#C87A5B;">${s.rating}</span></div>
                                </div>
                            </div>
                            <select class="status-select ${savedStatus}" onchange="updateStatus('${s.id}', this.value)">
                                <option value="new" ${savedStatus === 'new' ? 'selected' : ''}>⏳ Не отправлено</option>
                                <option value="sent" ${savedStatus === 'sent' ? 'selected' : ''}>✓ Отправлено</option>
                                <option value="waiting" ${savedStatus === 'waiting' ? 'selected' : ''}>💬 Ждет ответа</option>
                            </select>
                        </div>

                        <!-- ПРЕВЬЮ СКРИНШОТОВ -->
                        <div class="screens-row">
                            <div class="screen-thumb-wrap" onclick="openLightbox('${s.desktopScreen}')">
                                <img src="${s.desktopScreen}" alt="${s.name} Desktop">
                                <span class="screen-label">Десктоп</span>
                                <button class="copy-img-btn" onclick="event.stopPropagation(); copyImageToClipboard('${s.desktopScreen}', '${s.name}')" title="Скопировать картинку">📋 Скопировать</button>
                            </div>
                            <div class="screen-thumb-wrap" onclick="openLightbox('${s.mobileScreen}')">
                                <img src="${s.mobileScreen}" alt="${s.name} Mobile">
                                <span class="screen-label">Смартфон</span>
                                <button class="copy-img-btn" onclick="event.stopPropagation(); copyImageToClipboard('${s.mobileScreen}', '${s.name}')" title="Скопировать картинку">📋 Скопировать</button>
                            </div>
                        </div>

                        <!-- ТЕКСТ ДЛЯ ОТПРАВКИ -->
                        <div class="text-wrap">
                            <div class="text-header-line">
                                <span>Текст сообщения (можно редактировать прямо здесь):</span>
                                <span style="font-size:0.72rem; color:var(--accent);">Без личных имён • Человечный тон</span>
                            </div>
                            <textarea class="message-input" id="msg_${s.id}">${s.message}</textarea>
                        </div>

                        <!-- КНОПКИ ДЕЙСТВИЯ -->
                        <div class="actions-row">
                            <button class="btn btn-tg" onclick="sendToTelegram('${s.id}')">
                                <span>✈️ В Telegram</span>
                            </button>
                            <button class="btn btn-copy" onclick="copyFullMessage('${s.id}')">
                                <span>📋 Скопировать</span>
                            </button>
                            <a href="${s.siteUrl}" target="_blank" class="btn btn-site">
                                <span>🌐 Сайт</span>

                        </div>
                    </div>

            }).join('');
            updateSentStats();
        }

        // ОТПРАВКА В TELEGRAM
        function sendToTelegram(salonId) {
            const textarea = document.getElementById(`msg_${salonId}`);
            const text = textarea ? textarea.value : '';
            
            // Включаем прямую ссылку на скриншот десктопа в превью, чтобы Telegram сразу подгрузил картинку
            const salon = SALONS_DATA.find(s => s.id === salonId);
            const fullShareText = `${text}\n\nСкриншот оформления: https://fire8327.github.io/Beauty/${salon.desktopScreen}`;
            
            // URL-схема для отправки в Telegram
            const tgShareUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(fullShareText)}`;
            
            // Открываем окно отправки в Telegram
            window.open(tgShareUrl, '_blank');
            
            // Автоматически помечаем как "Отправлено"
            updateStatus(salonId, 'sent');
            const select = document.querySelector(`#card_${salonId} .status-select`);
            if (select) select.value = 'sent';
            
            showToast('✓ Telegram открыт! Сообщение и превью вставлены.');
        }

        // КОПИРОВАНИЕ ТЕКСТА
        function copyFullMessage(salonId) {
            const textarea = document.getElementById(`msg_${salonId}`);
            if (!textarea) return;
            navigator.clipboard.writeText(textarea.value).then(() => {
                showToast('✓ Текст сообщения скопирован в буфер!');
            }).catch(() => {
                textarea.select();
                document.execCommand('copy');
                showToast('✓ Скопировано!');
            });
        }

        // КОПИРОВАНИЕ КАРТИНКИ В БУФЕР ОБМЕНА ДЛЯ CTRL+V В ЧАТ
        async function copyImageToClipboard(imgSrc, salonName) {
            try {
                const response = await fetch(imgSrc);
                const blob = await response.blob();
                
                await navigator.clipboard.write([
                    new ClipboardItem({ [blob.type]: blob })
                ]);
                showToast(`✓ Скриншот для ${salonName} скопирован в буфер! Нажмите Ctrl+V в чате.`);
            } catch (err) {
                // Если браузер запрещает прямой ClipboardItem из-за разрешений, открываем картинку
                window.open(imgSrc, '_blank');
                showToast('Картинка открыта — нажмите ПКМ -> Копировать картинку');
            }
        }

        // СТАТУСЫ
        function updateStatus(salonId, status) {
            localStorage.setItem(`status_${salonId}`, status);
            const select = document.querySelector(`#card_${salonId} .status-select`);
            if (select) {
                select.className = `status-select ${status}`;
            }
            updateSentStats();
        }

        function updateSentStats() {
            let sent = 0;
            SALONS_DATA.forEach(s => {
                if (localStorage.getItem(`status_${s.id}`) === 'sent') sent++;
            });
            const counter = document.getElementById('sentCount');
            if (counter) counter.innerText = sent;
        }

        // TOAST
        function showToast(msg) {
            const toast = document.getElementById('toastBox');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3200);
        }

        // LIGHTBOX
        function openLightbox(src) {
            const modal = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            img.src = src;
            modal.classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('active');
        }

        window.onload = renderHub;
    </script>
</body>
</html>
